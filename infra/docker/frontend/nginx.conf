# Serves the built single-page app. The repo's reverse proxy (infra/nginx)
# forwards everything that is not /api/ here, on port 3000.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version in headers or error pages.
    server_tokens off;

    # --- Security headers -------------------------------------------------
    # Declared once here and repeated in every location below: nginx drops
    # inherited add_header lines as soon as a location adds one of its own.
    include /etc/nginx/snippets/security-headers.conf;

    # Fingerprinted build output: the file name changes when the content
    # does, so it can be cached for a year without ever going stale.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Liveness probe for the container runtime. Not logged: it fires every few seconds.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API calls belong to the backend and are routed there by the reverse
    # proxy. If one arrives here the proxy is misconfigured; answer 404 rather
    # than the app shell, which would look like a successful response.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 404 '{"message":"The API is not served from this container."}';
    }

    # Every other path is a client-side route: serve the app shell and let
    # the router decide. The shell is never cached, so a deploy is picked up
    # on the next page load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
