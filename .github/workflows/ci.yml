name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, docs, and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: npm ci
      - run: python -m pip install -r requirements-ci.txt
      - name: Check JavaScript, TypeScript, JSON, YAML, and Markdown formatting
        run: npm run format:check
      - name: Lint and check Python formatting
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Validate documentation and OpenAPI
        run: |
          python scripts/check_docs.py
          python -m openapi_spec_validator docs/api/openapi.json
      - name: Test release metadata and manifests
        run: |
          python scripts/project_version.py check
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate development and production Compose models
        run: python scripts/check_environments.py

  backend:
    name: Go lint and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clims_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clims_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://clims_ci:ci-only-password@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Lint Go
        run: go vet ./...
      - name: Unit and database integration tests with race detection
        run: go test -race -count=1 -timeout=5m ./...
      - name: Build API and administration command
        run: go build ./cmd/...

  clients:
    name: ${{ matrix.project }} lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - name: Check web app formatting
        if: matrix.project == 'frontend'
        run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - name: Test the web app with coverage
        if: matrix.project == 'frontend'
        run: npm run test:coverage
      - name: Build the web app
        if: matrix.project == 'frontend'
        run: npm run build
      # Only what ships to users. A finding in development tooling does not put
      # a vulnerable file in anyone's browser.
      - name: Audit shipped web dependencies
        if: matrix.project == 'frontend'
        run: npm audit --omit=dev --audit-level=high
      - name: Export iOS and Android JavaScript bundles
        if: matrix.project == 'mobile'
        run: npm run export

  frontend-image:
    name: Web app production image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build -f infra/docker/frontend/Dockerfile.prod -t clims-frontend:ci frontend
      - name: Smoke-test the image
        run: |
          docker run -d --name clims-frontend -p 3000:3000 clims-frontend:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          # A client-side route must return the app shell, not a 404.
          curl -fsS http://127.0.0.1:3000/moh/users | grep -q '<div id="root">'
          # A misrouted API call must not be answered with the app shell.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/users)" = "404"
