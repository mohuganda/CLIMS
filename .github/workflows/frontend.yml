name: Frontend

# Every change to the web app must pass the same gate a developer runs locally
# with `npm run check`: formatting, lint, types, tests with coverage, build.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'infra/docker/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'infra/docker/frontend/**'
      - '.github/workflows/frontend.yml'

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Only what ships to users. Development tooling is audited too, but a
      # finding there does not put a vulnerable file in anyone's browser.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build -f infra/docker/frontend/Dockerfile -t clims-frontend:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name clims-frontend -p 3000:3000 clims-frontend:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          # A client-side route must return the app shell, not a 404.
          curl -fsS http://127.0.0.1:3000/moh/users | grep -q '<div id="root">'
          # A misrouted API call must not be answered with the app shell.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/users)" = "404"
