version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clims_postgres
    environment:
      POSTGRES_DB: clims_db
      POSTGRES_USER: clims_user
      POSTGRES_PASSWORD: clims_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clims-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clims_user -d clims_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clims_backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
    depends_on:
      postgres:
        condition: service_healthy # Waits for Postgres to be fully ready before starting backend
    networks:
      - clims-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      # The image needs both frontend/ and infra/docker/frontend/, so the
      # build context is the repository root.
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        # Compiled into the bundle at build time. `/api` means "same origin,
        # through the nginx proxy below".
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: clims_frontend
    depends_on:
      backend:
        condition: service_healthy # Waits for backend health check to pass before starting frontend
    networks:
      - clims-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: clims_nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - clims-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  clims-net:
    driver: bridge
