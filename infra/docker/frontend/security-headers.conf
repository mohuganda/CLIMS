# Response headers for the CLIMS web app. Included by nginx.conf.

# Never let a response be reinterpreted as another content type.
add_header X-Content-Type-Options "nosniff" always;

# The app is never meant to be embedded; this blocks clickjacking.
# (frame-ancestors below says the same to modern browsers.)
add_header X-Frame-Options "DENY" always;

# Send only the origin, not the full path, to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The app uses none of these device features, so no script may ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content-Security-Policy: what the page may load and where it may send data.
#   script-src   own scripts, plus Google Maps for the hotspot map. No inline
#                script and no eval, so injected markup cannot run code.
#   style-src    'unsafe-inline' is needed: the UI kit positions popovers and
#                the charts size themselves with inline style attributes.
#   connect-src  'self' covers the API when it is served under /api on this
#                origin. If VITE_API_BASE_URL points at another origin, add
#                that origin here or every API call will be blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
