# Shared definitions. Always combine with exactly one environment override.
name: clims

services:
  postgres:
    environment:
      POSTGRES_DB: ${DB_NAME:-clims_db}
      POSTGRES_USER: ${DB_USER:-clims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-clims_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the selected environment file}
      DB_NAME: ${DB_NAME:-clims_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the selected environment file}
      PORT: 8080
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # wget exists in both the Vite development image and the nginx production image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  nginx:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_nginx/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
