resolver 127.0.0.11 valid=10s ipv6=off;
upstream clims_backend { zone clims_backend 64k; server backend:8080 resolve; }
upstream clims_frontend { zone clims_frontend 64k; server frontend:3000 resolve; }

# Preserve paths: Go routes include /api/v1, /docs, and /health.
server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /_nginx/health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /api { proxy_pass http://clims_backend; }
    location /api/ { proxy_pass http://clims_backend; }
    location = /docs { proxy_pass http://clims_backend; }
    location /docs/ { proxy_pass http://clims_backend; }
    location = /health { proxy_pass http://clims_backend; }
    location /health/ { proxy_pass http://clims_backend; }

    location / {
        proxy_pass http://clims_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
